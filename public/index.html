<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u-agent · 随身 AI 助手</title>
<style>
:root{
  --bg:#0a0d13;--bg2:#0e1219;--surface:#121722;--elev:#161d2a;--hover:#1b2432;
  --line:#1e2836;--line2:#2a3850;
  --fg:#e9eef6;--dim:#8b96a8;--faint:#5b6678;
  --acc:#5e8bff;--acc2:#38bdf8;--acc-soft:rgba(94,139,255,.14);
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:22px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --grad:linear-gradient(135deg,#6d7dff,#38bdf8);
}
html[data-theme="light"]{
  --bg:#f4f6fb;--bg2:#eef1f8;--surface:#ffffff;--elev:#ffffff;--hover:#f0f4fa;
  --line:#e3e9f2;--line2:#cfd9e8;
  --fg:#182234;--dim:#5d6a80;--faint:#93a0b4;
  --acc:#3b6ef5;--acc2:#0ea5e9;--acc-soft:rgba(59,110,245,.1);
  --shadow:0 8px 30px rgba(24,40,80,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--acc-soft)}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.65 system-ui,"Segoe UI","Microsoft YaHei UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;transition:all .15s ease}
input,textarea,select{font:inherit;color:var(--fg)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

#app{display:flex;height:100vh}
#side{width:248px;min-width:248px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;min-width:0}

.logo{display:flex;align-items:center;gap:9px;padding:16px 16px 12px;font-weight:800;font-size:15.5px;letter-spacing:.3px}
.logo .mark{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900;box-shadow:0 2px 10px rgba(94,139,255,.4)}
.logo .mark i{font-style:normal}
.logo small{color:var(--faint);font-weight:500;font-size:11px;margin-left:auto}
#newChat{margin:4px 12px 10px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--grad);color:#fff;border:0;border-radius:var(--r-m);padding:9px;font-size:13.5px;font-weight:600;box-shadow:0 2px 12px rgba(94,139,255,.35)}
#newChat:hover{filter:brightness(1.1)}
#sessWrap{flex:1;overflow-y:auto;padding:2px 8px 8px}
#sessWrap h5{color:var(--faint);font-size:11px;font-weight:600;padding:8px 8px 4px;letter-spacing:.5px}
.sess{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;color:var(--dim);font-size:13px;margin-bottom:1px;border:1px solid transparent}
.sess:hover{background:var(--hover);color:var(--fg)}
.sess.on{background:var(--acc-soft);color:var(--fg);border-color:rgba(94,139,255,.25)}
.sess .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .tm{font-size:10.5px;color:var(--faint)}
.sess .del{opacity:0;border:0;background:none;color:var(--faint);font-size:12px;padding:2px 4px;border-radius:5px}
.sess:hover .del{opacity:1}
.sess .del:hover{color:var(--bad);background:rgba(248,113,113,.12)}
.sess .del.confirm{opacity:1;color:#fff;background:var(--bad)}
#sideFoot{padding:10px 14px;font-size:11px;color:var(--faint);border-top:1px solid var(--line);line-height:1.8}

#top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
#modeSel,#provSel{border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
#modeSel:focus,#provSel:focus{outline:1px solid var(--acc)}
#modeHint{font-size:11.5px;color:var(--faint)}
.sp{flex:1}
.ghost{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:6px 12px;font-size:12.5px}
.ghost:hover{color:var(--fg);border-color:var(--line2)}

#msgs{flex:1;overflow-y:auto}
.col{max-width:780px;margin:0 auto;padding:24px 20px 10px}
.m{display:flex;gap:12px;margin-bottom:22px}
.ava{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800;margin-top:2px}
.m.user .ava{background:var(--hover);color:var(--dim);border:1px solid var(--line)}
.m.ai .ava{background:var(--grad);color:#fff;box-shadow:0 2px 10px rgba(94,139,255,.35)}
.m .body{flex:1;min-width:0}
.m .who{font-size:11.5px;color:var(--faint);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.m .who .ops{opacity:0;display:flex;gap:2px;transition:opacity .15s}
.m:hover .who .ops{opacity:1}
.ops button{border:0;background:none;color:var(--faint);font-size:11px;padding:2px 7px;border-radius:6px}
.ops button:hover{background:var(--hover);color:var(--fg)}
.bubble{border-radius:var(--r-l);padding:11px 15px;word-break:break-word}
.m.user .bubble{background:var(--acc-soft);border:1px solid rgba(94,139,255,.2);white-space:pre-wrap}
.m.ai .bubble{background:var(--surface);border:1px solid var(--line)}
.bubble p{margin:6px 0;white-space:pre-wrap}
.bubble h1,.bubble h2,.bubble h3{margin:12px 0 6px;line-height:1.4}
.bubble h1{font-size:17px}.bubble h2{font-size:15.5px}.bubble h3{font-size:14px}
.bubble ul{margin:6px 0;padding-left:22px}
.bubble li{margin:3px 0}
.bubble blockquote{border-left:3px solid var(--line2);color:var(--dim);padding:2px 12px;margin:8px 0}
.bubble code{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:12.5px;background:var(--hover);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.bubble hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.bubble a{color:var(--acc);text-decoration:none}
.bubble a:hover{text-decoration:underline}
.cb{margin:10px 0;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--bg)}
.cb .ch{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--elev);border-bottom:1px solid var(--line);font-size:11px;color:var(--dim)}
.cb .ch .copy{border:0;background:none;color:var(--faint);font-size:11px;padding:2px 8px;border-radius:6px}
.cb .ch .copy:hover{color:var(--fg);background:var(--hover)}
.cb pre{margin:0;padding:12px 14px;overflow-x:auto}
.cb pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.6;color:var(--fg);white-space:pre}
.bubble img.att{max-width:240px;max-height:180px;border-radius:var(--r-m);border:1px solid var(--line);margin:6px 8px 0 0;display:inline-block}
.cursor{display:inline-block;width:8px;height:15px;background:var(--acc);vertical-align:-2px;animation:bl 1s infinite;border-radius:2px}
@keyframes bl{50%{opacity:0}}

.tcard{border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg2);margin:10px 0;overflow:hidden}
.tcard summary{cursor:pointer;padding:9px 13px;font-size:12.5px;list-style:none;display:flex;gap:9px;align-items:center;user-select:none}
.tcard summary::-webkit-details-marker{display:none}
.tcard summary:hover{background:var(--hover)}
.tdot{width:8px;height:8px;border-radius:50%;flex:none}
.tdot.run{background:var(--ok)}.tdot.confirm,.tdot.pending{background:var(--acc)}.tdot.deny{background:var(--bad)}
.tname{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.tsum{color:var(--faint);font-size:11.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstate{font-size:10.5px;border-radius:99px;padding:2px 9px;flex:none}
.s-ok{background:rgba(52,211,153,.13);color:var(--ok)}
.s-wait{background:var(--acc-soft);color:var(--acc)}
.s-bad{background:rgba(248,113,113,.13);color:var(--bad)}
.tcard .tbody{border-top:1px solid var(--line);padding:10px 13px;font-size:12px}
.tcard .lb{color:var(--faint);font-size:10.5px;margin:7px 0 3px;letter-spacing:.4px}
.tcard pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--dim);margin:0}
.tcard.sub{margin-left:30px;border-style:dashed}
.subname{color:var(--acc2);font-weight:700;font-size:12px}

#welcome{text-align:center;padding:8vh 20px 0}
#welcome .big{width:58px;height:58px;border-radius:18px;background:var(--grad);display:grid;place-items:center;margin:0 auto 18px;color:#fff;font-size:22px;font-weight:900;box-shadow:0 6px 28px rgba(94,139,255,.4)}
#welcome h1{font-size:21px;margin-bottom:6px}
#welcome p{color:var(--dim);font-size:13px;margin-bottom:26px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--dim);border-radius:var(--r-l);padding:10px 16px;font-size:12.5px}
.chip:hover{border-color:var(--acc);color:var(--fg);transform:translateY(-1px)}

#compWrap{padding:0 20px 14px}
#comp{max-width:780px;margin:0 auto;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:10px 12px 8px}
#imgs{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
#imgs .chip2{position:relative}
#imgs img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#imgs .x{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border:0;border-radius:50%;width:17px;height:17px;font-size:10px;cursor:pointer;line-height:1}
#inRow{display:flex;gap:8px;align-items:flex-end}
#attach{background:none;border:0;color:var(--faint);border-radius:10px;width:34px;height:34px;font-size:17px;flex:none}
#attach:hover{background:var(--hover);color:var(--fg)}
#txt{flex:1;background:none;border:0;color:var(--fg);padding:7px 4px;font:14px/1.55 inherit;resize:none;max-height:150px;min-height:24px;outline:none}
#send{background:var(--grad);color:#fff;border:0;border-radius:12px;width:36px;height:36px;flex:none;display:grid;place-items:center}
#send:hover{filter:brightness(1.12)}
#send.stop{background:var(--bad)}
#compHint{max-width:780px;margin:6px auto 0;font-size:11px;color:var(--faint);text-align:center;min-height:16px}
#scrollBtn{position:absolute;right:24px;bottom:110px;background:var(--elev);border:1px solid var(--line2);color:var(--dim);border-radius:99px;padding:7px 14px;font-size:12px;box-shadow:var(--shadow);display:none;z-index:5}
#scrollBtn.show{display:block}
#main{position:relative}

#drawer{position:fixed;top:0;right:-470px;width:450px;height:100vh;background:var(--bg2);border-left:1px solid var(--line);transition:right .25s ease;z-index:30;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.open{right:0}
#drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
#drawer .dh button{background:none;border:0;color:var(--dim);font-size:17px}
#drawer .db{flex:1;overflow-y:auto;padding:16px 18px}
.fld{margin-bottom:18px}
.fld>label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600}
.fld input,.fld select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:var(--r-s);padding:8px 11px;font-size:13px}
.fld input:focus,.fld select:focus{outline:1px solid var(--acc)}
.provRow{border:1px solid var(--line);border-radius:var(--r-m);padding:10px;margin-bottom:10px;background:var(--surface)}
.provRow .pr{display:flex;gap:8px;margin-bottom:6px}
.provRow input,.provRow select{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:6px 9px;font-size:12.5px;min-width:0}
.provRow .nm{width:86px;flex:none}.provRow .pt{width:132px;flex:none}
.provRow .bu,.provRow .mo,.provRow .ky{flex:1}
.provRow .del{background:none;border:0;color:var(--faint);cursor:pointer;font-size:14px}
.provRow .del:hover{color:var(--bad)}
.btn{background:var(--grad);color:#fff;border:0;border-radius:var(--r-s);padding:9px 18px;font-size:13px;font-weight:600}
.btn.gray{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.gray:hover{border-color:var(--line2)}

#mask{position:fixed;inset:0;background:rgba(4,6,10,.6);backdrop-filter:blur(3px);display:none;z-index:50;align-items:center;justify-content:center}
#mask.show{display:flex}
#confirmBox{background:var(--elev);border:1px solid var(--line2);border-radius:var(--r-l);width:460px;max-width:92vw;padding:20px;box-shadow:var(--shadow)}
#confirmBox h3{margin-bottom:10px;color:var(--warn);font-size:15px}
#cfmMeta{font-size:12.5px;color:var(--dim);margin-bottom:8px}
#cfmBody{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:11px;font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-bottom:14px;color:var(--dim)}
#confirmBox .row{display:flex;gap:10px;justify-content:flex-end}
#cfmYes{background:var(--ok);color:#04120b;border:0}
#cfmNo{background:var(--surface);color:var(--fg);border:1px solid var(--line)}

#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--elev);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:var(--r-s);padding:10px 16px;font-size:12.5px;box-shadow:var(--shadow);animation:tin .2s ease;max-width:340px}
.toast.err{border-left-color:var(--bad)}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
#lock.hide{display:none}
#lock .card{text-align:center;width:340px}
#lock .lk-mark{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;margin:0 auto 16px;color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 28px rgba(94,139,255,.45)}
#lock .lk-mark i{font-style:normal}
#lock h1{font-size:19px;margin-bottom:4px}
#lock .lk-sub{color:var(--dim);font-size:12.5px;margin-bottom:22px}
#lock input{background:var(--surface);border:1px solid var(--line2);color:var(--fg);border-radius:var(--r-m);padding:11px 14px;font-size:14px;width:100%;text-align:center;margin-bottom:10px}
#lock input:focus{outline:1px solid var(--acc)}
#lock .lk-btn{background:var(--grad);color:#fff;border:0;border-radius:var(--r-m);padding:11px;width:100%;font-size:14px;font-weight:600}
#lock .lk-err{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:8px}
#lock .lk-hint{color:var(--faint);font-size:11px;margin-top:14px;line-height:1.7}
.err{border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:var(--bad);border-radius:var(--r-m);padding:10px 14px;margin:10px 0;font-size:13px}
.plan-card{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r-m);background:var(--bg2);padding:11px 14px;margin:10px 0}
.plan-card h4{font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.4px}
.plan-card .pi{display:flex;gap:8px;font-size:13px;margin:4px 0;align-items:baseline}
.plan-card .pi.done{color:var(--faint);text-decoration:line-through}
.plan-card .pi.doing{color:var(--fg);font-weight:600}
.diff{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);margin-bottom:14px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.7}
.diff .dh2{padding:7px 12px;color:var(--dim);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);font-size:11px}
.diff .dl{padding:0 12px;white-space:pre-wrap;word-break:break-all}
.diff .dl.add{background:rgba(52,211,153,.1);color:var(--ok)}
.diff .dl.del{background:rgba(248,113,113,.1);color:var(--bad)}
.diff .dl.ctx{color:var(--faint)}
#palette{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;width:540px;max-width:92%;background:var(--elev);border:1px solid var(--line2);border-radius:var(--r-m);box-shadow:var(--shadow);z-index:20;overflow:hidden;display:none}
#palette.show{display:block}
.pal-item{display:flex;gap:12px;padding:9px 15px;cursor:pointer;font-size:13px;align-items:center}
.pal-item.on{background:var(--hover)}
.pal-item .pcmd{font-family:ui-monospace,monospace;color:var(--acc);font-weight:700;min-width:96px}
.pal-item .pd{color:var(--dim);font-size:12px}
#imgs .chip3{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--dim)}
#imgs .chip3 button{background:none;border:0;color:var(--faint);font-size:11px}
#imgs .chip3 button:hover{color:var(--bad)}
#usage{font-size:11px;color:var(--faint);white-space:nowrap}
.toast{white-space:pre-line}
#memBox{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:var(--r-s);padding:8px 11px;font-size:12.5px;resize:vertical;min-height:70px}
</style>
</head>
<body>

<div id="lock"><div class="card">
  <div class="lk-mark"><i>u</i></div>
  <h1>u-agent 随身 AI</h1>
  <div class="lk-sub" id="lkSub">输入密码解锁</div>
  <input id="lkPw1" type="password" placeholder="设置密码（至少 4 位）" style="display:none">
  <input id="lkPw2" type="password" placeholder="再输一遍确认" style="display:none">
  <input id="lkPw" type="password" placeholder="密码">
  <div class="lk-err" id="lkErr"></div>
  <button class="lk-btn" id="lkGo">解锁</button>
  <div class="lk-hint">密码只存在这台 U 盘里（哈希，不存明文）。<br>忘记密码：删掉 U 盘 data 文件夹里的 lock.json 即可重设。</div>
</div></div>

<div id="app">
  <div id="side">
    <div class="logo"><span class="mark"><i>u</i></span>u-agent<small>随身 AI</small></div>
    <button id="newChat"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新会话</button>
    <div id="sessWrap"><h5>最近会话</h5><div id="sessList"></div></div>
    <div id="sideFoot">数据全部在本 U 盘<br>关窗即停 · 零残留</div>
  </div>
  <div id="main">
    <div id="top">
      <select id="modeSel" title="权限模式">
        <option value="confirm">确认模式（高危需确认）</option>
        <option value="readonly">只读模式</option>
        <option value="plan">计划模式</option>
        <option value="auto">自动审批（高危不执行）</option>
        <option value="full">完全权限</option>
      </select>
      <span id="modeHint"></span>
      <span id="usage"></span>
      <div class="sp"></div>
      <button class="ghost" id="themeBtn" title="切换明暗主题">🌙</button>
      <select id="provSel" title="模型通道"></select>
      <button class="ghost" id="gear"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>

<script>
const $=s=>document.querySelector(s);
const HINTS={confirm:"每次高危操作都会弹窗征求你同意",readonly:"只能看不能改，写操作会被拒绝",plan:"先调研出计划，不执行改动",auto:"普通操作自动执行，高危操作直接拦截",full:"所有操作直接执行（含高危），全部记入审计日志"};
const ICONS={fs:'M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z M13 2v7h7',term:'M4 17l6-6-6-6 M12 19h8',git:'M6 3v12 M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M18 9a9 9 0 0 1-9 9 M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',web:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z',bot:'M12 2v4 M8 6h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z M9 12h.01 M15 12h.01',info:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 16v-4 M12 8h.01',trash:'M3 6h18 M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2 M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'};
const TICON={fs_list:"fs",fs_read:"fs",fs_write:"fs",fs_edit:"fs",fs_mkdir:"fs",fs_move:"fs",fs_delete:"trash",fs_search:"fs",shell_run:"term",git_status:"git",git_diff:"git",git_log:"git",git_commit:"git",git_push:"git",git_pull:"git",web_search:"web",web_fetch:"web",spawn_subagent:"bot",sys_info:"info"};
const ticon=n=>`<svg class="ic" style="width:13px;height:13px;color:var(--dim)" viewBox="0 0 24 24"><path d="${ICONS[TICON[n]||"info"]}"/></svg>`;
const tstate={run:["已自动执行","s-ok"],confirm:["待确认","s-wait"],deny:["已拦截","s-bad"],pending:["执行中","s-wait"],done:["已完成","s-ok"],err:["出错","s-bad"],refused:["已拒绝","s-bad"]};
let sessionId=null,sending=false,curMode="confirm",confirmQueue=[],pendImgs=[],pendTexts=[],lastSent=null,nearBottom=true;
let ctxBudget={chars:0,tokens:0},sessionTokens={input:0,output:0},curPlan=null;
const msgsEl=$("#msgs"),msgCol=$("#msgCol");

function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function relTime(ms){const d=Date.now()-ms;if(d<60000)return"刚刚";if(d<3600000)return Math.floor(d/60000)+" 分钟前";if(d<86400000)return Math.floor(d/3600000)+" 小时前";if(d<7*86400000)return Math.floor(d/86400000)+" 天前";return new Date(ms).toLocaleDateString();}
function md(src){
  src=String(src??"");
  const blocks=[];
  src=src.replace(/```(\w*)[ \t]*\n([\s\S]*?)```/g,(_,lang,code)=>{blocks.push({lang:lang||"text",code:code.replace(/\n$/,"")});return`\u0000B${blocks.length-1}\u0000`;});
  let h=esc(src);
  h=h.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  h=h.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  h=h.replace(/^&gt; (.*)$/gm,"<blockquote>$1</blockquote>");
  h=h.replace(/^---+$/gm,"<hr>");
  h=h.replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>");
  h=h.replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  h=h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.split(/\n{2,}/).map(seg=>{
    const t=seg.trim();
    if(!t)return"";
    if(/^<(h\d|ul|ol|blockquote|hr)/.test(t)||t.startsWith("\u0000B")||/^<li>/.test(t))return t;
    return"<p>"+t+"</p>";
  }).join("");
  return h.replace(/\u0000B(\d+)\u0000/g,(_,i)=>{
    const b=blocks[+i];
    return`<div class="cb"><div class="ch"><span>${esc(b.lang)}</span><button class="copy">复制</button></div><pre><code>${esc(b.code)}</code></pre></div>`;
  });
}
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild;}
function toast(msg,type=""){const t=el(`<div class="toast ${type}">${esc(msg)}</div>`);$("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),250)},3200);}
function nearBottomNow(){return msgsEl.scrollHeight-msgsEl.scrollTop-msgsEl.clientHeight<90;}
function scrollEnd(force){if(force||nearBottom)msgsEl.scrollTop=msgsEl.scrollHeight;}
msgsEl.addEventListener("scroll",()=>{nearBottom=nearBottomNow();$("#scrollBtn").classList.toggle("show",!nearBottom&&msgCol.children.length>2);});
$("#scrollBtn").onclick=()=>{nearBottom=true;msgsEl.scrollTop=msgsEl.scrollHeight;$("#scrollBtn").classList.remove("show");};
document.addEventListener("click",e=>{
  const b=e.target.closest(".copy");
  if(b){navigator.clipboard.writeText(b.closest(".cb").querySelector("code").textContent);b.textContent="已复制";setTimeout(()=>b.textContent="复制",1200);}
  const mc=e.target.closest(".mcopy");
  if(mc){navigator.clipboard.writeText(mc.dataset.text);toast("已复制到剪贴板","ok");}
});

function welcome(){
  msgCol.innerHTML=`<div id="welcome"><div class="big">u</div><h1>你好，我是 u-agent</h1>
  <p>跑在这台 U 盘里的随身 AI——能读写文件、跑命令、查资料、推 git、派子 agent。<br>当前通道：Mock（离线演示）。接真实模型：右上角「设置」。</p>
  <div class="chips">
    <button class="chip">看一下工作区里有什么文件</button>
    <button class="chip">在工作区新建 hello.txt 写一句话</button>
    <button class="chip">搜索一下今天的科技新闻</button>
    <button class="chip">把工作区的改动 git 提交并推送</button>
  </div></div>`;
  msgCol.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("#txt").value=c.textContent;$("#txt").focus();autoGrow();});
}
function addUserMsg(text,images){
  if($("#welcome"))msgCol.innerHTML="";
  const imgs=(images||[]).map(i=>`<img class="att" src="data:${i.mediaType};base64,${i.data}">`).join("");
  msgCol.appendChild(el(`<div class="m user"><div class="ava">你</div><div class="body"><div class="who">你</div><div class="bubble">${md(text)}${imgs}</div></div></div>`));
  scrollEnd();
}
function addAiStream(){
  const d=el(`<div class="m ai"><div class="ava"><i>u</i></div><div class="body"><div class="who">u-agent <span class="ops"></span></div><div class="bubble"><span class="txt"></span><span class="cursor"></span></div></div></div>`);
  msgCol.appendChild(d);scrollEnd();return d;
}
function finishAi(d,text){
  d.querySelector(".cursor")?.remove();
  if(text!==undefined)d.querySelector(".txt").innerHTML=md(text);
  const ops=d.querySelector(".ops");
  if(text)ops.innerHTML=`<button class="mcopy" data-text="${esc(text)}">复制全文</button>`;
  scrollEnd();
}
function addErr(m){msgCol.appendChild(el(`<div class="err">✕ ${esc(m)}</div>`));scrollEnd();}
function addToolCard(ev){
  const [label,cls]=tstate[ev._state||"pending"];
  const a=ev.args||{};
  const sum=a.path||a.command||a.query||a.task||a.message||a.url||"";
  const c=el(`<details class="tcard"><summary><span class="tdot ${ev._state||"pending"}"></span>${ticon(ev.name)}<span class="tname">${esc(ev.name)}</span><span class="tsum">${esc(String(sum).slice(0,80))}</span><span class="tstate ${cls}">${label}</span></summary>
    <div class="tbody"><div class="lb">参数</div><pre>${esc(JSON.stringify(a,null,2))}</pre><div class="lb">结果</div><pre class="rres"></pre></div></details>`);
  c.dataset.tid=ev.id;msgCol.appendChild(c);scrollEnd();return c;
}
function finishTool(c,ev){
  const [label,cls]=ev.denied?tstate.refused:ev.ok===false?tstate.err:tstate.done;
  const s=c.querySelector("summary .tstate");s.textContent=label+(ev.ms?` · ${ev.ms}ms`:"");s.className="tstate "+cls;
  c.querySelector(".rres").textContent=ev.text||"";
  c.querySelector("summary .tdot").className="tdot "+(ev.denied||ev.ok===false?"deny":"run");
  scrollEnd();
}
function addSubCard(name){
  const c=el(`<details class="tcard sub" open><summary><span class="tdot pending"></span><span class="subname">子agent · ${esc(name)}</span><span class="tstate s-wait">运行中</span></summary><div class="tbody subbody"></div></details>`);
  msgCol.appendChild(c);scrollEnd();return c;
}

function renderUsage(){
  const t=sessionTokens.input+sessionTokens.output;
  $("#usage").textContent=ctxBudget.chars?`上下文≈${(ctxBudget.chars/1000).toFixed(1)}k字${ctxBudget.over?"（建议 /compact）":""}${t?" · 本次 "+t+" tokens":""}`:"";
}
function renderPlan(items){
  curPlan=items;
  const html=`<div class="plan-card" id="planCard"><h4>任务计划 · ${items.filter(i=>i.status==="done").length}/${items.length} 步完成</h4>${items.map(it=>`<div class="pi ${it.status}"><span>${it.status==="done"?"✅":it.status==="doing"?"🔵":"⚪"}</span><span>${esc(it.step)}</span></div>`).join("")}</div>`;
  const card=document.getElementById("planCard");
  if(card)card.outerHTML=html;else msgCol.appendChild(el(html));
  scrollEnd();
}
function setSendUI(){
  const b=$("#send");
  b.classList.toggle("stop",sending);
  b.innerHTML=sending?'<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg class="ic" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>';
  b.title=sending?"停止":"发送";
  $("#compHint").textContent=sending?"正在执行…点 ■ 可中止（子agent 与工具一并中断）":HINTS[curMode]||"";
}
async function send(retry){
  if(sending)return;
  let text=retry??$("#txt").value.trim();
  if(!retry&&text.startsWith("/remember ")){
    const content=text.slice(10).trim();
    if(content){
      const cur=await(await fetch("/api/memory")).json().catch(()=>({text:""}));
      const merged=((cur.text||"").trim()+String.fromCharCode(10)+"- "+content).trim();
      const rr=await fetch("/api/memory",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:merged})});
      toast(rr.ok?"已写入跨会话记忆":"记忆写入失败",rr.ok?"ok":"err");
    }
    $("#txt").value="";autoGrow();return;
  }
  if(!retry&&pendTexts.length){
    const fence="```";
    text=(text?text+"\n\n":"")+pendTexts.map(t=>`【文件 ${t.name}】\n${fence}\n${t.text}\n${fence}`).join("\n\n");
  }
  const images=retry?[]:pendImgs.map(i=>({mediaType:i.mediaType,data:i.data}));
  if(!text&&!images.length)return;
  if(!sessionId)sessionId="s-"+Date.now().toString(36);
  if(!retry)lastSent={text};
  addUserMsg(text,images);
  if(!retry){$("#txt").value="";autoGrow();pendImgs.forEach(i=>URL.revokeObjectURL(i.url));pendImgs=[];pendTexts=[];renderImgs();}
  sending=true;setSendUI();
  let stream=addAiStream();
  let full="";
  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({sessionId,message:{text,images},mode:curMode,provider:$("#provSel").value})});
    if(!res.ok||!res.body){const j=await res.json().catch(()=>({}));throw new Error(j.error||`HTTP ${res.status}`);}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
    const tools=new Map(),subs=new Map();
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+2);
        if(!line.startsWith("data:"))continue;
        let ev;try{ev=JSON.parse(line.slice(5));}catch{continue;}
        handle(ev);
      }
    }
    function handle(ev){
      switch(ev.type){
        case "session":sessionId=ev.sessionId;if(ev.budget){ctxBudget=ev.budget;renderUsage();}refreshSessions();break;
        case "usage":sessionTokens={input:ev.input,output:ev.output};renderUsage();break;
        case "plan":renderPlan(ev.items);break;
        case "assistant_delta":full+=ev.delta;stream.querySelector(".txt").textContent=full;scrollEnd();break;
        case "assistant_message":
          full=ev.text;finishAi(stream,full);
          stream=addAiStream();full=""; // 固化本轮，新开气泡给下一轮
          break;
        case "tool_call":tools.set(ev.id,addToolCard(ev));break;
        case "tool_result":{const c=tools.get(ev.id);if(c)finishTool(c,ev);break;}
        case "confirm_request":queueConfirm(ev);break;
        case "subagent_event":{
          if(ev.event.type==="confirm_request"){queueConfirm(ev.event);break;}
          const key=ev.name+ev.sessionId;
          if(!subs.has(key)&&["assistant_delta","tool_call","assistant_message"].includes(ev.event.type))subs.set(key,addSubCard(ev.name));
          const card=subs.get(key);
          if(card){
            const body=card.querySelector(".subbody");
            if(ev.event.type==="tool_call")body.appendChild(el(`<div style="font-family:ui-monospace,monospace;font-size:11.5px;color:var(--dim);margin:4px 0">${ticon(ev.event.name)} ${esc(ev.event.name)} — ${esc(JSON.stringify(ev.event.args||{})).slice(0,110)}</div>`));
            else if(ev.event.type==="tool_result")body.appendChild(el(`<div style="font-size:11.5px;color:${ev.event.ok?"var(--ok)":"var(--bad)"};margin:4px 0">${ev.event.ok?"✓":"✕"} ${esc((ev.event.text||"").slice(0,140))}</div>`));
            else if(ev.event.type==="assistant_message")body.appendChild(el(`<div style="font-size:12.5px;white-space:pre-wrap;margin:4px 0">${esc(ev.event.text)}</div>`));
            scrollEnd();
          }
          if(ev.event.type==="done"){const c=subs.get(key);if(c){c.querySelector(".tstate").textContent="已结束";c.querySelector(".tstate").className="tstate s-ok";c.querySelector(".tdot").className="tdot run";}}
          break;}
        case "error":finishAi(stream);addErr(ev.message);toast(ev.message,"err");break;
        case "done":{
          const empty=!stream.querySelector(".txt").textContent&&!full;
          if(empty)stream.remove();
          else finishAi(stream,ev.text||full||"（无输出）");
          if(ev.stopped)toast(ev.text,"err");
          break;}
      }
    }
  }catch(e){
    finishAi(stream);addErr(e.message);toast(e.message,"err");
  }finally{
    sending=false;setSendUI();refreshSessions();
    const lastAi=[...msgCol.querySelectorAll(".m.ai")].at(-1);
    if(lastAi===stream&&!lastAi.querySelector(".ops").innerHTML&&lastSent){
      lastAi.querySelector(".ops").innerHTML=`<button class="regen">↻ 重新生成</button>`;
      lastAi.querySelector(".regen").onclick=()=>{if(!sending)send(lastSent.text);};
    }
  }
}
$("#send").onclick=()=>{sending?doAbort():send();};
async function doAbort(){try{await fetch("/api/abort",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sessionId})});}catch{}}

function queueConfirm(ev){confirmQueue.push(ev);if(confirmQueue.length===1)showConfirm();}
function showConfirm(){
  const ev=confirmQueue[0];
  $("#cfmMeta").textContent=`工具：${ev.name} · 风险：${ev.risk||"high"}`;
  const pv=ev.preview;
  if(pv&&pv.kind==="diff"&&pv.lines&&pv.lines.length){
    const st=pv.stat||{add:0,del:0};
    $("#cfmBody").innerHTML=`<div style="color:var(--dim);font-size:11.5px;margin-bottom:6px">${esc(pv.path||"")} · <span style="color:var(--ok)">+${st.add}</span> <span style="color:var(--bad)">−${st.del}</span>${pv.note?" · "+esc(pv.note):""}</div>`+
      `<div class="diff">${pv.lines.map(l=>`<div class="dl ${l.op==="+"?"add":l.op==="-"?"del":"ctx"}">${esc(l.op+" "+l.text)}</div>`).join("")}</div>`;
  }else{
    const note=pv&&pv.note?pv.note+"\n\n":"";
    $("#cfmBody").textContent=note+JSON.stringify(ev.args||{},null,2);
  }
  $("#mask").classList.add("show");
}
async function resolveConfirm(approve){
  const ev=confirmQueue.shift();
  $("#mask").classList.remove("show");
  try{await fetch("/api/confirm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({confirmId:ev.confirmId,approve})});}catch{}
  if(confirmQueue.length)setTimeout(showConfirm,300);
}
$("#cfmYes").onclick=()=>resolveConfirm(true);
$("#cfmNo").onclick=()=>resolveConfirm(false);

function renderImgs(){
  $("#imgs").innerHTML="";
  pendImgs.forEach((p,ix)=>{
    const d=el(`<div class="chip2"><img src="${p.url}"><button class="x">✕</button></div>`);
    d.querySelector(".x").onclick=()=>{URL.revokeObjectURL(p.url);pendImgs.splice(ix,1);renderImgs();};
    $("#imgs").appendChild(d);
  });
  pendTexts.forEach((t,ix)=>{
    const d=el(`<div class="chip3">📄 ${esc(t.name)} · ${(t.text.length/1024).toFixed(1)}KB<button>✕</button></div>`);
    d.querySelector("button").onclick=()=>{pendTexts.splice(ix,1);renderImgs();};
    $("#imgs").appendChild(d);
  });
}
const TEXT_EXT=/\.(txt|md|json|jsonl|js|mjs|ts|tsx|jsx|py|html|css|yml|yaml|csv|log|ini|toml|sh|ps1|bat|cmd|c|h|cpp|java|go|rs|xml|sql|env)$/i;
function addFiles(files){
  for(const f of files){
    if(/^image\//.test(f.type)){
      if(f.size>5*1048576){toast(`图片 ${f.name} 超过 5MB`,"err");continue;}
      const url=URL.createObjectURL(f);
      const r=new FileReader();
      r.onload=()=>{pendImgs.push({mediaType:f.type,data:String(r.result).split(",")[1],url});renderImgs();};
      r.readAsDataURL(f);
    }else if(/^text\//.test(f.type)||TEXT_EXT.test(f.name)){
      const total=pendTexts.reduce((a,t)=>a+t.text.length,0);
      if(total+f.size>204800){toast(`文本附件合计上限 200KB，跳过 ${f.name}`,"err");continue;}
      const r=new FileReader();
      r.onload=()=>{pendTexts.push({name:f.name,text:String(r.result).slice(0,102400)});renderImgs();toast(`已附上 ${f.name}`,"ok");};
      r.readAsText(f);
    }else toast(`跳过 ${f.name}（不是图片或文本文件）`,"err");
  }
}
$("#attach").onclick=()=>$("#file").click();
$("#file").onchange=e=>{addFiles([...e.target.files]);e.target.value="";};
document.addEventListener("paste",e=>{if(sending)return;addFiles([...(e.clipboardData?.files||[])]);});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();if(!sending)addFiles([...(e.dataTransfer?.files||[])]);});

const txt=$("#txt");
function autoGrow(){txt.style.height="auto";txt.style.height=Math.min(txt.scrollHeight,150)+"px";}
txt.addEventListener("keydown",e=>{
  if(palOpen){
    if(e.key==="ArrowDown"){e.preventDefault();palIdx=(palIdx+1)%palList.length;palRender();return;}
    if(e.key==="ArrowUp"){e.preventDefault();palIdx=(palIdx-1+palList.length)%palList.length;palRender();return;}
    if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();palPick();return;}
    if(e.key==="Escape"){palClose();e.preventDefault();return;}
  }
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
});
txt.addEventListener("input",()=>{autoGrow();palUpdate();});

/* ===== 斜杠命令面板 ===== */
const CMDS=[
 {cmd:"/new",desc:"开始新会话"},
 {cmd:"/mode",desc:"切换权限模式",sub:"mode"},
 {cmd:"/model",desc:"切换模型通道",sub:"model"},
 {cmd:"/compact",desc:"压缩上下文，腾出对话空间"},
 {cmd:"/init",desc:"让 agent 阅读工作区并生成 AGENTS.md 约定文件"},
 {cmd:"/status",desc:"查看状态：模式/通道/用量/计划"},
 {cmd:"/remember",desc:"写入跨会话记忆（空格后接内容）"},
 {cmd:"/help",desc:"显示全部命令"},
];
let palList=[],palIdx=0,palOpen=false;
function palRender(){
  const box=$("#palette");
  if(!palList.length){box.classList.remove("show");palOpen=false;return;}
  box.innerHTML=palList.map((c,i)=>`<div class="pal-item ${i===palIdx?"on":""}"><span class="pcmd">${esc(c.pcmd||c.cmd)}</span><span class="pd">${esc(c.desc||"")}</span></div>`).join("");
  [...box.children].forEach((d,i)=>{d.onmousedown=e=>{e.preventDefault();palIdx=i;palPick();};});
  box.classList.add("show");palOpen=true;
}
function palClose(){$("#palette").classList.remove("show");palOpen=false;}
function palUpdate(){
  const v=txt.value;
  if(!v.startsWith("/")){palClose();return;}
  const sp=v.indexOf(" ");
  if(sp<0){palList=CMDS.filter(c=>c.cmd.startsWith(v));palIdx=0;palRender();return;}
  const cmd=v.slice(0,sp),rest=v.slice(sp+1).toLowerCase();
  if(cmd==="/mode"){
    palList=[["confirm","确认模式（高危弹窗）"],["readonly","只读模式"],["plan","计划模式"],["auto","自动审批（高危拦截）"],["full","完全权限"]]
      .filter(([m])=>m.startsWith(rest)).map(([m,d])=>({cmd:m,pcmd:"/mode "+m,desc:d}));
    palIdx=0;palRender();return;
  }
  if(cmd==="/model"){
    palList=[...$("#provSel").options].map(o=>({cmd:o.value,pcmd:"/model "+o.value,desc:o.textContent})).filter(c=>c.cmd.toLowerCase().startsWith(rest));
    palIdx=0;palRender();return;
  }
  palClose();
}
async function palPick(){
  if(!palList.length)return;
  const it=palList[palIdx];
  const v=txt.value,sp=v.indexOf(" ");
  const cmd=sp<0?v:v.slice(0,sp);
  if(it.pcmd&&it.pcmd.startsWith("/mode ")){$("#modeSel").value=it.cmd;$("#modeSel").dispatchEvent(new Event("change"));toast("已切换到"+it.desc,"ok");txt.value="";palClose();autoGrow();return;}
  if(it.pcmd&&it.pcmd.startsWith("/model ")){$("#provSel").value=it.cmd;fetch("/api/settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({active:it.cmd})});toast("已切到 "+it.desc,"ok");txt.value="";palClose();autoGrow();return;}
  switch(cmd){
    case "/new":txt.value="";palClose();autoGrow();$("#newChat").click();return;
    case "/compact":txt.value="";palClose();autoGrow();doCompact();return;
    case "/init":txt.value="请通读工作区（用 fs_list/fs_search/fs_read 检索），生成一份 AGENTS.md 写入工作区根目录：内容含这个文件夹的用途、关键文件说明、常用命令与注意事项，精炼实用。";autoGrow();txt.focus();palClose();return;
    case "/status":default:txt.value="";palClose();autoGrow();showStatus(true);return;
    case "/remember":txt.value="/remember ";autoGrow();txt.focus();palClose();return;
  }
}
async function doCompact(){
  if(!sessionId){toast("还没有会话，无需压缩","err");return;}
  toast("正在压缩上下文…");
  const r=await fetch("/api/compact",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sessionId,provider:$("#provSel").value})});
  const j=await r.json().catch(()=>({}));
  if(j.ok){toast(`压缩完成：${(j.before.chars/1000).toFixed(1)}k字 → ${(j.after.chars/1000).toFixed(1)}k字`,"ok");refreshSessions();}
  else toast(j.error||"压缩失败","err");
}
async function showStatus(full){
  let st={};
  try{st=await(await fetch("/api/settings")).json();}catch{}
  const lines=[
    `模型通道：${$("#provSel").value}`,
    `权限模式：${$("#modeSel").selectedOptions[0]?.textContent||curMode}`,
    `工作区：${st.workspace||"（未设置）"}`,
    `上下文估算：≈${(ctxBudget.chars/1000).toFixed(1)}k 字${ctxBudget.over?"（建议 /compact 压缩）":""}`,
    `本会话 tokens：输入 ${sessionTokens.input} / 输出 ${sessionTokens.output}`,
    `计划：${curPlan?curPlan.filter(i=>i.status==="done").length+"/"+curPlan.length+" 步完成":"无"}`,
  ];
  if(full)lines.push("","可用命令："+CMDS.map(c=>c.cmd).join("  "));
  toast(lines.join(String.fromCharCode(10)),"ok");
}

let drawerProv=[];
function openDrawer(){

      <div class="pr"><input class="bu" value="${esc(p.baseURL||"")}" placeholder="服务地址，如 https://api.deepseek.com"><input class="mo" value="${esc(p.model||"")}" placeholder="模型名"></div>

async function refreshSessions(){
  try{
    const list=await(await fetch("/api/sessions")).json();
    const box=$("#sessList");box.innerHTML="";
    list.filter(s=>!s.id.startsWith("sub-")).slice(0,30).forEach(s=>{
      const d=el(`<div class="sess ${s.id===sessionId?"on":""}"><span class="t" title="${esc(s.title||s.id)}">${esc(s.title||"新会话")}</span><span class="tm">${relTime(s.mtime)}</span><button class="del" title="删除">🗑</button></div>`);
      d.querySelector(".t").onclick=()=>loadSession(s.id);
      d.querySelector(".t").ondblclick=e=>{
        e.stopPropagation();
        const span=d.querySelector(".t");
        const inp=document.createElement("input");
        inp.value=s.title||"";
        inp.style.cssText="flex:1;background:var(--bg);border:1px solid var(--acc);border-radius:5px;color:var(--fg);font-size:12.5px;padding:2px 6px;min-width:0";
        span.replaceWith(inp);inp.focus();inp.select();
        const done=async(save)=>{if(save)await fetch("/api/session-rename",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:s.id,title:inp.value})});refreshSessions();};
        inp.onkeydown=e2=>{if(e2.key==="Enter"){e2.preventDefault();done(true);}if(e2.key==="Escape")done(false);};
        inp.onblur=()=>done(true);
      };
      const del=d.querySelector(".del");
      del.onclick=e=>{
        e.stopPropagation();
        if(!del.classList.contains("confirm")){del.classList.add("confirm");del.textContent="确认";setTimeout(()=>{del.classList.remove("confirm");del.textContent="🗑";},2500);return;}
        fetch("/api/session?id="+encodeURIComponent(s.id),{method:"DELETE"}).then(()=>{if(s.id===sessionId){sessionId=null;welcome();}refreshSessions();toast("会话已删除","ok");});
      };
      box.appendChild(d);
    });
  }catch{}
}
async function loadSession(id){
  if(sending)return;
  const j=await(await fetch("/api/session?id="+encodeURIComponent(id))).json();
  sessionId=id;msgCol.innerHTML="";
  const toolMap={};
  for(const ev of j.events){
    switch(ev.type){
      case "user":addUserMsg(ev.text,ev.images);break;
      case "assistant_message":{const d=addAiStream();finishAi(d,ev.text);break;}
      case "tool_call":toolMap[ev.id]=addToolCard(ev);break;
      case "tool_result":{const c=toolMap[ev.id];if(c)finishTool(c,ev);break;}
      case "error":addErr(ev.message);break;
    }
  }
  if(!msgCol.children.length)welcome();
  refreshSessions();
}
$("#newChat").onclick=()=>{if(sending)return;sessionId=null;lastSent=null;welcome();refreshSessions();};

let lockMode="unlock";
function resetLockUI(){lockMode="unlock";$("#lkSub").textContent="输入密码解锁";$("#lkPw1").style.display="none";$("#lkPw2").style.display="none";$("#lkPw").style.display="";$("#lkPw1").value="";$("#lkPw2").value="";$("#lkPw").value="";$("#lkErr").textContent="";$("#lkGo").textContent="解锁";}
async function doUnlock(pw){
  const r=await fetch("/api/unlock",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw})});
  if(r.ok){$("#lock").classList.add("hide");mainInit();return true;}
  $("#lkErr").textContent="密码不对";$("#lkPw").value="";return false;
}
async function doSetup(){
  const a=$("#lkPw1").value,b=$("#lkPw2").value;
  if(a.length<4){$("#lkErr").textContent="密码至少 4 位";return;}
  if(a!==b){$("#lkErr").textContent="两次输入不一致";return;}
  const r=await fetch("/api/lock-set",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:a})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){$("#lkErr").textContent=j.error||"设置失败";return;}
  await doUnlock(a);
}
$("#lkGo").onclick=()=>{lockMode==="setup"?doSetup():doUnlock($("#lkPw").value);};
for(const id of ["lkPw","lkPw1","lkPw2"])$("#"+id).addEventListener("keydown",e=>{if(e.key==="Enter")$("#lkGo").click();});
const _fetch=window.fetch;
window.fetch=async(...a)=>{const r=await _fetch(...a);if(r&&r.status===401){try{const j=await r.clone().json();if(j.locked){resetLockUI();$("#lock").classList.remove("hide");}}catch{}}return r;};

async function mainInit(){
  try{
    const st=await(await fetch("/api/settings")).json();
    fillProviderSel(st);
    if(st.workspace)$("#wsInput").value=st.workspace;
  }catch(e){addErr("服务未就绪："+e.message);}
  welcome();
  refreshSessions();
  setSendUI();
}

  }catch{}
  welcome();
  setSendUI();
})();
</script>
